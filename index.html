/* Layout: fixed left rail of 8 sections + one working pane; tables and two-column compare views collapse to one column under 900px. */

.sticky-bar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr)}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

 jc.filter(n=>!heldC.includes(n)).forEach(n=>learn.push({k:'Certification: '+n,level:'expected',status:'missing'}));

/* ---------- CV building ---------- */
function bulletScore(text,jdKeys,conceptsOn){
 let s=0;detectTerms(text,true).forEach(t=>{if(jdKeys.has(t.k))s+=2});
 CONCEPTS.forEach(c=>{if(conceptsOn.has(c.k)&&c.rx.test(text))s+=1});
 return s;
}
function skillCat(s){const t=detectTerms(s,true)[0];return t?t.c:'Other'}
function buildCV(profile,job,an,opt){
 const tailored=!!job;const flags=[],changes=[];
 const jdKeys=new Set(tailored?an.terms.map(t=>t.k):[]);
 const conceptsOn=new Set(tailored?an.concepts.map(c=>c.k):[]);
 const inc=opt.includeUnverified;
 /* header */
 const H=[];
 H.push(profile.name||'[ADD NAME]');
 if(profile.headline)H.push(tailored&&opt.targetRole?opt.targetRole:profile.headline);
 const contact=[profile.location,profile.email||'[ADD EMAIL]'];
 if(opt.includePhone&&profile.phone)contact.push(profile.phone);
 if(opt.includeLinks&&profile.links)contact.push(profile.links);
 H.push(contact.filter(Boolean).join(', '));
 /* skills */
 const groups={};
 const kwOk=[];
 const kw=(opt.keywords||[]).filter(Boolean);
 const pText=allProfileText(profile);
 const kwSet=new Set();
 kw.forEach(k=>{const kl=k.toLowerCase();if(pText.includes(kl)||detectTerms(k,false).some(t=>termEvidence(t,profileCorpus(profile)).level==='strong')){kwOk.push(k);kwSet.add(kl)}else flags.push(`Keyword "${k}" is not supported by your profile, so it was not added. Add it to your profile only if it is true.`)});
 profile.skills.forEach(s=>{
  const hit=tailored&&(detectTerms(s,true).some(t=>jdKeys.has(t.k))||kwSet.has(s.toLowerCase()));
  (groups[skillCat(s)]=groups[skillCat(s)]||[]).push({s,hit});
 });
 const catHits=c=>groups[c].filter(x=>x.hit).length;
 let cats=CAT_ORDER.filter(c=>groups[c]);
 if(tailored)cats=cats.sort((a,b)=>catHits(b)-catHits(a)||CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b));
 const skillsTxt=cats.map(c=>{const items=tailored?[...groups[c]].sort((a,b)=>b.hit-a.hit):groups[c];return`${c}: ${items.map(x=>x.s).join(', ')}`}).join('\n');
 if(tailored)changes.push({what:'Skills regrouped and reordered',why:`Skills that match the posting come first: ${[...new Set(profile.skills.filter(s=>detectTerms(s,true).some(t=>jdKeys.has(t.k))))].slice(0,6).join(', ')||'none matched directly'}.`});
 /* summary */
 let summary=profile.summary;
 if(tailored){
  const strong=an.terms.filter(t=>t.status==='strong').sort((a,b)=>RANK[b.level]-RANK[a.level]).map(t=>t.k).slice(0,6);
  const role=opt.targetRole||job.title;
  const parts=[`${profile.headline||'Cloud and DevOps engineer'} targeting ${role} roles${opt.country?' in '+opt.country:''}.`];
  if(strong.length)parts.push(`Hands-on experience with ${strong.join(', ')}, gained as ${[...new Set(profile.experience.map(e=>e.title))].slice(0,3).join(', ')}.`);
  else parts.push(`Experience as ${[...new Set(profile.experience.map(e=>e.title))].slice(0,3).join(', ')}.`);
  const ms=profile.education.find(e=>/master|msc/i.test(e.degree));
  if(ms)parts.push(`${ms.status==='completed'?'Holds':'Currently studying for'} ${ms.degree.replace(/^MSc, /,'MSc in ')} at ${ms.school.split(',')[0]}${ms.dates?' ('+ms.dates+')':''}.`);
  const jk=jdKeys;const cert=profile.certs.find(c=>!/training/i.test(c)&&detectTerms(c,false).some(t=>jk.has(t.k)));
  if(cert)parts.push(`Certification: ${cert}.`);
  summary=parts.join(' ');
  changes.push({what:'Professional summary rewritten',why:`Targets "${role}" and names only technologies your profile supports and the posting asks for.`});
 }
 /* experience */
 let exps=profile.experience.map((e,i)=>({e,i,rel:e.bullets.reduce((a,b)=>a+bulletScore(b.text,jdKeys,conceptsOn),0)}));
 if(tailored){
  exps.sort((a,b)=>b.rel-a.rel||a.i-b.i);
  const moved=exps.map(x=>x.i).join()!==exps.map((x,i)=>i).join();
  if(moved)changes.push({what:'Roles reordered by relevance',why:exps.map(x=>`${x.e.company} (${x.rel} matches)`).join(', ')+'. Dates are unchanged.'});
 }
 const maxB=tailored&&opt.pages===1?3:99;
 const expTxt=exps.map(({e})=>{
  let bl=e.bullets.map((b,i)=>({b,i,s:tailored?bulletScore(b.text,jdKeys,conceptsOn):0}));
  if(tailored){bl.sort((a,b)=>b.s-a.s||a.i-b.i);if(bl.length>maxB){changes.push({what:`Trimmed ${e.company} to ${maxB} bullets`,why:'One-page target. Lowest-relevance bullets were dropped from this version only.'});bl=bl.slice(0,maxB)}}
  const lines=bl.map(({b})=>{
   let t=b.text;
   if(b.metric){
    if(b.metricVerified||inc)t+=`, ${b.metric.replace(/^~/,'approximately ')}`+(b.metricVerified?'':' [CONFIRM METRIC]');
    else if(!tailored)t+=`, ${b.metric} [UNVERIFIED]`;
    else flags.push(`Metric omitted until verified: "${b.metric}" (${e.company}). Verify it in your profile to include it.`);
   }
   return'- '+t;
  });
  return`${e.title}, ${e.company} (${e.dates})\n${lines.join('\n')}`;
 }).join('\n\n');
 /* projects */
 let pr=profile.projects.map((p,i)=>({p,i,s:tailored?bulletScore(p.name+' '+p.desc,jdKeys,conceptsOn):0}));
 if(tailored){pr.sort((a,b)=>b.s-a.s||a.i-b.i);if(opt.pages===1)pr=pr.slice(0,2)}
 const projTxt=pr.map(({p})=>`- ${p.name}: ${p.desc}`).join('\n');
 const eduTxt=profile.education.map(e=>`${e.degree}, ${e.school}${e.dates?' ('+e.dates+')':''}${e.status==='in-progress'?', in progress':''}`).join('\n');
 const certTxt=profile.certs.map(c=>'- '+c).join('\n');
 if(!profile.education.every(e=>e.dates))flags.push('Education dates are incomplete (for example the bachelor degree years). Add them in your profile.');
 const sections={header:H.join('\n'),summary,skills:skillsTxt,experience:expTxt,projects:projTxt,education:eduTxt,certs:certTxt};
 return{sections,flags,changes};
}
const SEC_ORDER=[['header','Header'],['summary','SUMMARY'],['skills','TECHNICAL SKILLS'],['experience','EXPERIENCE'],['projects','PROJECTS'],['education','EDUCATION'],['certs','CERTIFICATIONS']];
const assembleCV=s=>SEC_ORDER.map(([k,h])=>k==='header'?s[k]:(s[k]&&s[k].trim()?`${h}\n${s[k]}`:'')).filter(Boolean).join('\n\n');

/* ---------- validation ---------- */
function numbersIn(t){return(String(t).match(/\d[\d,.]*\+?%?/g)||[]).map(x=>x.replace(/[.,]+$/,''))}
function unsupported(text,profile,allowLearning){
 const corp=profileCorpus(profile);const out=[];
 const ptxt=allProfileText(profile);
 detectTerms(text,false).forEach(t=>{let e=termEvidence(t,corp).level;if(e==='missing'&&has(ptxt,termAl(t,true)))e='strong';if(e==='missing')out.push({k:t.k,sev:'fail'});else if((e==='learning'||e==='related')&&!allowLearning)out.push({k:t.k,sev:'warn'})});
 const pn=new Set(numbersIn(allProfileText(profile)));
 const nums=[...new Set(numbersIn(text))].filter(n=>!pn.has(n)&&!pn.has(n.replace(/[%+]$/,'')));
 return{terms:out,nums};
}
function validateCV(cv,profile,job,an,opt){
 const checks=[];const add=(id,label,status,detail)=>checks.push({id,label,status,detail});
 const body=cv.split('\n').slice(3).join('\n');
 const missingHdr=profile.experience.filter(e=>!cv.includes(`${e.title}, ${e.company} (${e.dates})`));
 add('facts','Employers, titles and dates match your profile',missingHdr.length?'fail':'pass',missingHdr.length?'Altered or removed: '+missingHdr.map(e=>e.company).join(', '):'All four roles appear exactly as recorded.');
 const un=unsupported(body,profile,true);
 add('claims','No unsupported tools or qualifications',un.terms.some(t=>t.sev==='fail')?'fail':'pass',un.terms.length?un.terms.map(t=>`${t.k} is ${t.sev==='fail'?'not in your profile':'only partly supported'}`).join('; '):'Every technology named is supported by your profile.');
 add('nums','Numbers and metrics are traceable',un.nums.length?'warn':'pass',un.nums.length?'Not found in your profile: '+un.nums.join(', '):'Every number appears in your profile data.');
 const unv=profile.experience.flatMap(e=>e.bullets.filter(b=>b.metric&&!b.metricVerified&&cv.includes(b.metric.replace(/^~/,'approximately '))).map(b=>b.metric));
 add('metrics','Unverified metrics excluded or marked',unv.length?'fail':'pass',unv.length?'Unverified metric present: '+unv.join('; '):'No unverified metric is stated as fact.');
 const yrs=(cv.match(/\b(19|20)\d{2}\b/g)||[]);const py=new Set((allProfileText(profile).match(/\b(19|20)\d{2}\b/g)||[]));
 const badY=yrs.filter(y=>!py.has(y));
 add('dates','Dates are consistent',badY.length?'fail':'pass',badY.length?'Years not in profile: '+[...new Set(badY)].join(', '):'All years appear in your profile.');
 if(an){
  const req=an.terms.filter(t=>t.level==='required'&&t.status!=='missing');
  const low=cv.toLowerCase();
  const inCV=req.filter(t=>has(low,termAl(TAXBY[t.k],true)));
  const miss=req.filter(t=>!inCV.includes(t));
  add('kw','Keyword coverage for supported mandatory requirements',!req.length?'warn':miss.length?'warn':'pass',!req.length?'No mandatory requirements were detected.':`${inCV.length} of ${req.length} appear in the CV${miss.length?'. Not shown: '+miss.map(t=>t.k).join(', '):'.'}`);
 }
 const bad=cv.match(/[\t│┃║▪●•→✓★✔►■□]|[\u{1F300}-\u{1FAFF}]/u);
 const hasHeads=['SUMMARY','EXPERIENCE','EDUCATION'].every(h=>cv.includes('\n'+h+'\n')||cv.startsWith(h+'\n'));
 add('ats','ATS-friendly formatting',bad||!hasHeads?'fail':'pass',bad?'Contains tabs, tables or decorative symbols.':!hasHeads?'A standard heading (SUMMARY, EXPERIENCE, EDUCATION) is missing.':'Plain text, standard headings, hyphen bullets, no tables.');

 add('ph','No placeholders left',ph.length?'fail':'pass',ph.length?'Resolve: '+[...new Set(ph)].join(', '):'No placeholders remain.');
 const words=cv.split(/\s+/).filter(Boolean).length;const target=opt.pages===1?560:1000;
 add('len',`Length fits ${opt.pages===1?'one page':'two pages'}`,words>target?'warn':'pass',`${words} words (target up to about ${target}).`);
 return checks;
}

function topEvidence(profile,an,n){
 const corp=profileCorpus(profile);const jk=new Map(an.terms.map(t=>[t.k,t]));
 const rows=[];
 profile.experience.forEach(e=>e.bullets.forEach(b=>{const s=bulletScore(b.text,new Set(jk.keys()),new Set(an.concepts.map(c=>c.k)));if(s>0)rows.push({s,e,b})}));
 rows.sort((a,b)=>b.s-a.s);
 const seen=new Set(),out=[];
 for(const r of rows){if(seen.has(r.e.company)&&out.length<n-1&&rows.length>n)continue;seen.add(r.e.company);out.push(r);if(out.length>=n)break}
 return out;
}

function genInterview(job,an,profile){

 const blob=await z.generateAsync({type:'blob'});
 if(!dlFn){toast('File saving is not available in this view.');return}

function nextVersion(jobId,type){return 1+Math.max(0,...S.docs.filter(d=>d.jobId===jobId&&d.type===type).map(d=>d.version))}
const DOC_LABEL={cv:'CV',cover:'Cover letter',linkedin:'LinkedIn message',email:'Email',motivation:'Motivation statement',interview:'Interview prep'};
const docTitle=d=>`${DOC_LABEL[d.type]} - ${d.company} - ${d.role} - v${d.version}`;
function saveDoc(jobId,type,content,note){
 const j=jobById(jobId);const d={id:uid(),jobId,type,company:j.company,role:j.title,version:nextVersion(jobId,type),content,createdAt:new Date().toISOString(),note:note||''};
 S.docs.push(d);
 if(type==='cv'){j.cvVersion=`v${d.version}`;if(EARLY.includes(j.status)&&j.status!=='Ready to apply')setStatus(j,'CV ready')}
 if(type==='cover'){j.coverVersion=`v${d.version}`}

}
function setStatus(j,st){
 if(j.status===st)return;
 j.history=j.history||[];j.history.push({at:new Date().toISOString(),from:j.status,to:st});
 j.status=st;j.updated=new Date().toISOString();
 if(st==='Applied'){if(!j.appliedDate)j.appliedDate=todayISO();if(!j.followUp)j.followUp=addDays(todayISO(),S.settings.followUpDays)}
 save();
}
function ensureAnalysis(j){
 if(!j.analysis||j.analysis.profileSig!==sig()){const a=analyzeJob(j,S.profile,S.settings);a.profileSig=sig();j.analysis=a;j.score=a.score;save()}
 return j.analysis;
}

const CITIES={Oslo:'Norway',Bergen:'Norway',Stavanger:'Norway',Trondheim:'Norway',Drammen:'Norway',Asker:'Norway','Bærum':'Norway','Lillestrøm':'Norway',Kristiansand:'Norway',Fornebu:'Norway',Amsterdam:'Netherlands',Rotterdam:'Netherlands',Utrecht:'Netherlands',Eindhoven:'Netherlands','The Hague':'Netherlands','Den Haag':'Netherlands'};
function parseJD(t){
 const out={};const lines=t.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
 if(lines[0]&&lines[0].length<=90)out.title=lines[0].replace(/^(job title|title|stilling)\s*[:\-]\s*/i,'');
 let m=t.match(/(?:company|employer|selskap|bedrift)\s*[:\-]\s*([^\n]{2,60})/i);if(m)out.company=m[1].trim();
 for(const c in CITIES){if(new RegExp('\\b'+c+'\\b','i').test(t)){out.location=c;out.country=CITIES[c];break}}
 if(!out.country){if(/\bnorway\b|\bnorge\b/i.test(t))out.country='Norway';else if(/\bnetherlands\b|\bnederland\b/i.test(t))out.country='Netherlands'}
 m=t.match(/\b(remote|hybrid|on-?site|hjemmekontor)\b/i);if(m)out.arrangement=/remote|hjemme/i.test(m[1])?'Remote':/hybrid/i.test(m[1])?'Hybrid':'On-site';
 m=t.match(/(?:deadline|application deadline|søknadsfrist|apply by|closing date|frist)[^\d]{0,25}(\d{1,2})[./-](\d{1,2})[./-](\d{4})/i);
 if(m)out.deadline=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
 else{m=t.match(/(?:deadline|søknadsfrist|apply by|closing date|frist)[^\d]{0,25}(\d{4})-(\d{2})-(\d{2})/i);if(m)out.deadline=`${m[1]}-${m[2]}-${m[3]}`}
 m=t.match(/(?:NOK|EUR|€|kr\.?)\s?\d[\d.,\s]*(?:\s?[-–]\s?\d[\d.,]*)?/i);if(m)out.salary=m[0].trim();
 const ls=[];const cl=classifyLines(splitLines(t));
 for(const[name,rx]of LANGS){const hit=cl.filter(x=>!x.head&&rx.test(x.l));if(hit.length){const lv=hit.some(x=>PREF_RX.test(x.l))?'preferred':hit.some(x=>LANG_REQ_RX.test(x.l))?'required':'mentioned';ls.push(`${name}: ${lv}`)}}
 if(ls.length)out.languages=ls.join('; ');
 const au=splitLines(t).filter(l=>AUTH_RX.test(l)).slice(0,2);if(au.length)out.visa=au.join(' ');
 return out;
}

 const W=S.settings.weights;
 return head('Analyze Job','Deterministic scoring against your profile. Every point traces to evidence you can edit.',`<button class="btn" data-act="rerun" type="button">Re-run analysis</button><button class="btn primary" data-view="tailor" type="button">Tailor CV for this job</button>`)+

 `<div class="card"><div class="row" style="gap:20px;align-items:center"><div class="ring" style="--p:${a.score};--c:${col}"><div>${a.score}</div></div>

function lineSets(){

 const out={};Object.entries(m.sections).forEach(([k,t])=>{out[k]=new Set(t.split('\n').map(l=>k==='skills'?normSk(l):l.trim()).filter(Boolean))});
 return out;
}
const normSk=l=>{const i=l.indexOf(':');return i<0?l.trim():l.slice(0,i)+':'+l.slice(i+1).split(',').map(x=>x.trim()).sort().join(',')};
function classify(k,text,sets){
 return text.split('\n').map(l=>{
  const t=l.trim();if(!t)return{t:l,c:''};
  if(/\[(ADD|CONFIRM|VERIFY)|UNVERIFIED|CONFIRM METRIC/.test(t))return{t:l,c:'confirm'};
  const key=k==='skills'?normSk(t):t;
  const hit=sets[k]&&sets[k].has(key)||(k==='header'&&sets.header&&sets.header.has(t));
  return{t:l,c:hit?'verified':'suggested'};
 });
}

function parseCV(text){
 const keys=Object.fromEntries(SEC_ORDER.filter(x=>x[0]!=='header').map(([k,h])=>[h,k]));
 const out={header:'',summary:'',skills:'',experience:'',projects:'',education:'',certs:''};
 let cur='header',buf=[];
 const flush=()=>{out[cur]=buf.join('\n').trim();buf=[]};
 text.split('\n').forEach(l=>{if(keys[l.trim()]&&buf.length!==undefined&&l===l.trim()){flush();cur=keys[l.trim()]}else buf.push(l)});
 flush();return out;
}

function filtered(){
 const f=ui.filter;let r=[...S.jobs];
 if(f.status)r=r.filter(j=>j.status===f.status);
 if(f.q){const q=f.q.toLowerCase();r=r.filter(j=>[j.title,j.company,j.location,j.notes,j.recruiter].join(' ').toLowerCase().includes(q))}
 if(f.due)r=r.filter(j=>j.followUp&&daysUntil(j.followUp)<=7&&!['Rejected','Withdrawn'].includes(j.status));
 const cmp={score:(a,b)=>(b.score??-1)-(a.score??-1)||((b.analysis&&b.analysis.raw)||0)-((a.analysis&&a.analysis.raw)||0),followUp:(a,b)=>(a.followUp||'9').localeCompare(b.followUp||'9'),deadline:(a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9'),updated:(a,b)=>(b.updated||'').localeCompare(a.updated||''),company:(a,b)=>a.company.localeCompare(b.company),status:(a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status)}[f.sort]||(()=>0);
 return r.sort(cmp);
}

const CSV_COLS=['id','company','title','status','score','url','location','country','source','sourceType','discovered','deadline','appliedDate','followUp','interviewDate','cvVersion','coverVersion','recruiter','notes'];
const csvCell=v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return/[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=jobs=>[CSV_COLS.join(','),...jobs.map(j=>CSV_COLS.map(c=>csvCell(j[c])).join(','))].join('\n');
function parseCSV(t){
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
  else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
  else cell+=c;}
 if(cell||row.length){row.push(cell);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()));
}
function doImport(text,replace){
 text=text.trim();if(!text)return{err:'Nothing to import. Paste JSON or CSV, or choose a file.'};
 let incoming=[],full=null;
 try{
  if(text[0]==='{'){full=JSON.parse(text);if(!Array.isArray(full.jobs))return{err:'This JSON has no "jobs" array. Use a file exported from this app.'};incoming=full.jobs}
  else if(text[0]==='['){incoming=JSON.parse(text)}
  else{
   const rows=parseCSV(text);const h=rows[0].map(x=>x.trim());
   if(!h.includes('company')||!h.includes('title'))return{err:'CSV needs a header row with at least "company" and "title".'};
   incoming=rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').replace(/^'(?=[=+\-@])/,'')])));
  }
 }catch(e){return{err:'Could not read that file: '+e.message}}
 const bad=incoming.filter(j=>!j||!j.title||!j.company).length;
 const good=incoming.filter(j=>j&&j.title&&j.company).map(j=>({...j,id:j.id||uid(),status:STATUSES.includes(j.status)?j.status:'Discovered',sourceType:j.sourceType||'import',score:j.score===''||j.score==null?null:+j.score,description:j.description||'',history:j.history||[],updated:j.updated||new Date().toISOString()}));
 if(replace){if(full){S=full;S.settings={...seedSettings(),...S.settings};S.docs=S.docs||[];S.profile=S.profile||seedProfile()}else S.jobs=[]}
 let added=0,upd=0,dup=0;
 good.forEach(g=>{
  const ex=S.jobs.find(x=>x.id===g.id);
  if(ex){Object.assign(ex,g);upd++;return}
  if(findDuplicates(S.jobs,g).length){dup++;return}
  S.jobs.push(g);added++;
 });
 if(full&&!replace){const ids=new Set(S.docs.map(d=>d.id));(full.docs||[]).forEach(d=>{if(!ids.has(d.id))S.docs.push(d)})}
 S.jobs.forEach(j=>{if(!j.analysis)j.score=j.score??null});
 save();
 return{ok:`Imported ${added} new, updated ${upd}${dup?`, skipped ${dup} duplicate${dup>1?'s':''}`:''}${bad?`, ignored ${bad} row${bad>1?'s':''} without title or company`:''}.`};
}

function showMsg(id,cls,html){const el=$('#'+id);if(el)el.innerHTML=`<div class="note ${cls}">${html}</div>`}
function saveJob(force){
 const o=readForm();const errs=validateJob(o);
 if(errs.length)return showMsg('form-msg','bad',`<ul class="list">${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
 const dups=findDuplicates(S.jobs,{id:ui.editingId,...o});
 if(dups.length&&!force){
  $('#form-msg').innerHTML=`<div class="note warn"><b>Possible duplicate.</b><ul class="list small">${dups.map(d=>`<li>${esc(d.why)}: ${esc(d.job.company)} - ${esc(d.job.title)} <button class="btn sm" data-act="edit-job" data-id="${d.job.id}" type="button">Open existing</button></li>`).join('')}</ul><div class="row"><button class="btn" data-act="save-job-force" type="button">Save anyway</button></div></div>`;return;
 }
 const now=new Date().toISOString();let j;
 if(ui.editingId){
  j=jobById(ui.editingId);const st=o.status;delete o.status;
  if(o.description!==j.description||o.title!==j.title||o.country!==j.country||o.languages!==j.languages||o.visa!==j.visa)j.analysis=null;
  Object.assign(j,o);setStatus(j,st);
 }else{
  j={id:uid(),...o,sourceType:'manual',history:[],score:null,analysis:null,updated:now,verifiedAt:''};S.jobs.push(j);
  if(j.status==='Applied'){j.appliedDate=todayISO();j.followUp=addDays(todayISO(),S.settings.followUpDays)}
 }
 j.updated=now;ui.jobId=j.id;ui.editingId=null;const a=ensureAnalysis(j);save();render();
 toast(`Saved. Match score ${a.score}, ${a.rec}.`);
}
function setPath(root,path,val){const ps=path.split('.');let o=root;for(let i=0;i<ps.length-1;i++){o=Array.isArray(o)?o.find(x=>x.id===ps[i]):o[ps[i]];if(!o)return false}o[ps[ps.length-1]]=val;return true}
function applyBind(t){
 const[root,path]=t.dataset.bind.split(':');
 let v=t.type==='checkbox'?t.checked:t.type==='number'?(isNaN(parseFloat(t.value))?0:parseFloat(t.value)):t.dataset.list?t.value.split('\n').map(s=>s.trim()).filter(Boolean):t.value;
 if(path==='cvPages')v=+v;
 setPath(root==='s'?S.settings:S.profile,path,v);
 if(path==='masterCvText')S.profile.masterCvUpdated=new Date().toISOString();
 if(path.startsWith('weights.')){const tot=Object.values(S.settings.weights).reduce((a,b)=>a+(+b||0),0);const el=$('#w-total');if(el)el.textContent=tot===100?'Weights add up to 100.':`Weights add up to ${tot}. They are scaled to 100 when scoring.`}
 save();
}
const pick=(arr,id)=>arr.findIndex(x=>x.id===id);
const ACT={
 'close-modal':()=>closeModal(),
 'close-bg':(t,e)=>{if(e.target===t)closeModal()},
 'copy-el':t=>copyText($('#'+t.dataset.el).value),
 'cancel-edit':()=>{ui.editingId=null;render()},
 'autofill':()=>{
  const d=$('#jf-description').value;if(d.trim().length<20)return showMsg('form-msg','warn','Paste a job description first.');
  const s=parseJD(d);let n=0;for(const k in s){const el=$('#jf-'+k);if(el&&!el.value){el.value=s[k];n++}}
  showMsg('form-msg','info',n?`Filled ${n} empty field${n>1?'s':''} from the description. Check each value before saving.`:'No empty fields could be filled from the text.');
 },
 'save-job':()=>saveJob(false),'save-job-force':()=>saveJob(true),
 'load-example':()=>{
  const j={id:uid(),title:'Cloud Engineer (example)',company:'Example AS',location:'Oslo',country:'Norway',url:'',discovered:todayISO(),deadline:'2026-11-15',arrangement:'Hybrid',languages:'English: required; Norwegian: preferred',visa:'',salary:'',source:'Built-in example',status:'Discovered',sourceType:'example',description:EXAMPLE_JD,history:[],score:null,analysis:null,updated:new Date().toISOString()};
  S.jobs.push(j);ui.jobId=j.id;ensureAnalysis(j);save();render();toast('Example job added. It is not a real vacancy.');
 },
 'edit-job':t=>{closeModal();ui.editingId=t.dataset.id;setView('find')},
 'del-job':t=>{
  const id=t.dataset.id;
  if(t.dataset.yes){S.jobs=S.jobs.filter(j=>j.id!==id);S.docs=S.docs.filter(d=>d.jobId!==id);if(S.draft&&S.draft.jobId===id)S.draft=null;if(S.pkg&&S.pkg.jobId===id)S.pkg=null;if(ui.jobId===id)ui.jobId=null;ui.confirm=null;closeModal();save();render();toast('Job deleted')}
  else{ui.confirm='del-job'+id;render();if($('#overlay').innerHTML)openJob(id)}
 },
 'verify-job':t=>{const j=jobById(t.dataset.id);j.verifiedAt=todayISO();save();render();toast('Marked as checked against the original posting')},
 'import-ext':()=>{
  let arr;try{arr=JSON.parse($('#imp-ext').value)}catch(e){return showMsg('imp-msg','bad','That is not valid JSON: '+esc(e.message))}
  if(!Array.isArray(arr))return showMsg('imp-msg','bad','Expected a JSON array of jobs.');
  let add=0,dup=0,bad=0;
  arr.forEach(x=>{
   if(!x||!x.title||!x.company||!x.description){bad++;return}
   const j={id:uid(),title:String(x.title),company:String(x.company),description:String(x.description),url:x.url||'',location:x.location||'',country:x.country||'',discovered:todayISO(),postedAt:x.postedAt||'',deadline:x.deadline||'',arrangement:x.arrangement||'',languages:x.languages||'',visa:x.visa||'',salary:x.salary||'',source:x.source||'External import',status:'Discovered',sourceType:'external',verifiedAt:'',history:[],score:null,analysis:null,updated:new Date().toISOString()};
   if(findDuplicates(S.jobs,j).length){dup++;return}
   S.jobs.push(j);ensureAnalysis(j);add++;
  });
  save();render();toast(`Imported ${add}${dup?`, skipped ${dup} duplicate${dup>1?'s':''}`:''}${bad?`, ${bad} invalid`:''}. Imported items are unverified.`);
 },
 'rerun':()=>{const j=curJob();j.analysis=null;ensureAnalysis(j);render();toast('Analysis updated')},
 'ai-opinion':async()=>{
  const j=curJob(),a=ensureAnalysis(j);const el=$('#ai-op');el.innerHTML='<p class="muted">Thinking...</p>';
  const prompt=`You are reviewing a job-fit analysis for a candidate. ${UNTRUSTED}\n\nCandidate profile (JSON):\n${profileForAI()}\n\n<untrusted_job_posting>\n${j.description.slice(0,6000)}\n</untrusted_job_posting>\n\nThe app's deterministic result: score ${a.score}/100, recommendation "${a.rec}". Missing: ${a.terms.filter(t=>t.status==='missing').map(t=>t.k).join(', ')||'none'}.\n\nIn under 180 words and plain text, give: (1) the two strongest points of fit with evidence taken from the profile, (2) the biggest risks, (3) anything in the posting you could not assess. Do not invent skills or experience.`;
  try{ui.aiText[j.id+':op']=await ask(prompt);el.innerHTML=aiBox(ui.aiText[j.id+':op'])}catch(e){el.innerHTML=`<div class="note bad">${esc(e.message)}</div>`}
 },
 'gen-cv':()=>{
  const j=curJob(),a=ensureAnalysis(j);
  const o={pages:$('#t-pages').value,targetRole:$('#t-role').value.trim(),country:$('#t-country').value.trim(),keywords:$('#t-kw').value,language:$('#t-lang').value};
  const r=buildCV(S.profile,j,a,cvOpts(j,o));
  if(o.language!=='English')r.flags.unshift(`The CV is built in English. Translate it after you approve the English version${sampleFn?' (button below)':''}. Your profile does not confirm ${o.language} fluency.`);
  S.draft={jobId:j.id,opts:o,gen:{...r.sections},sections:{...r.sections},flags:r.flags,changes:r.changes,edit:{},approved:false,at:new Date().toISOString()};
  save();render();
 },
 'edit-sec':t=>{const d=D();d.edit[t.dataset.sec]=!d.edit[t.dataset.sec];save();render()},
 'reset-sec':t=>{const d=D();d.sections[t.dataset.sec]=d.gen[t.dataset.sec];d.approved=false;save();render()},
 'recheck':()=>{$('#checks').innerHTML=checksHtml(curJob(),ensureAnalysis(curJob()))},
 'save-cv':()=>{
  const j=curJob(),d=D();const ch=validateCV(currentCVText(),S.profile,j,j.analysis,cvOpts(j,d.opts));
  $('#checks').innerHTML=checksHtml(j,j.analysis);
  if(ch.some(c=>c.status==='fail'))return toast('Fix the items marked "Fix" in the checklist first.');
  if(!$('#approve').checked)return toast('Tick the approval box after reviewing every section.');
  const v=saveDoc(j.id,'cv',currentCVText());render();toast('Saved: '+docTitle(v));
 },
 'copy-cv':()=>copyText(currentCVText()),
 'dl-cv':()=>{const j=curJob();saveFile(`${slug(j.company)}-${slug(j.title)}-cv-draft.txt`,currentCVText())},
 'dl-cv-docx':()=>{const j=curJob();saveDocx(`${slug(j.company)}-${slug(j.title)}-cv-draft.docx`,currentCVText())},
 'ai-polish':async()=>{
  const j=curJob(),d=D();const el=$('#ai-cv');el.innerHTML='<p class="muted">Thinking...</p>';
  const prompt=`Rewrite the SUMMARY and EXPERIENCE sections of this CV for a ${d.opts.targetRole||j.title} role. Rules: keep every employer, job title and date exactly as written, including each role's first line; use only facts present in the input; do not add tools, responsibilities, numbers, metrics or qualifications; keep the same roles and bullets count or fewer; use strong action verbs; plain text with "- " bullets; no tables or symbols. ${UNTRUSTED}\n\nReturn only JSON: {"summary":"...","experience":"..."}.\n\nSUMMARY:\n${d.sections.summary}\n\nEXPERIENCE:\n${d.sections.experience}\n\n<untrusted_job_posting>\n${j.description.slice(0,4000)}\n</untrusted_job_posting>`;
  try{
   const r=await ask(prompt,true);
   if(!r||typeof r.summary!=='string'||typeof r.experience!=='string')throw new Error('Claude returned an unexpected format. Nothing was changed.');
   d.sections.summary=r.summary.trim();d.sections.experience=r.experience.trim();d.approved=false;
   d.flags.unshift('Summary and experience were reworded by Claude. Read them closely; the checklist flags anything unsupported.');
   save();render();toast('Reworded. Review the checklist.');
  }catch(e){el.innerHTML=`<div class="note bad">${esc(e.message)}</div>`}
 },
 'ai-translate-cv':async()=>{
  const d=D(),el=$('#ai-cv');el.innerHTML='<p class="muted">Thinking...</p>';
  try{const t=await ask(`Translate this CV into ${d.opts.language}. Keep all names, employers, dates, numbers, tool names and structure unchanged. Do not add anything. Use ATS-friendly plain text with the same section headings translated.\n\n${currentCVText()}`);ui.aiText.cvtr=t;el.innerHTML=aiBox(t)+`<div class="row" style="margin-top:6px"><button class="btn sm" data-act="copy-tr" type="button">Copy</button></div>`}
  catch(e){el.innerHTML=`<div class="note bad">${esc(e.message)}</div>`}
 },
 'copy-tr':()=>copyText(ui.aiText.cvtr||''),
 'load-ver':t=>{const x=S.docs.find(d=>d.id===t.dataset.id);const s=parseCV(x.content);const old=D();
  S.draft={jobId:x.jobId,opts:old?old.opts:{pages:S.settings.cvPages,targetRole:x.role,country:'',keywords:''},gen:s,sections:{...s},flags:[`Loaded ${docTitle(x)}. Re-approve it before saving a new version.`],changes:[],edit:{},approved:false};save();render()},
 'dl-doc':t=>{const x=S.docs.find(d=>d.id===t.dataset.id);saveFile(`${slug(x.company)}-${slug(x.role)}-${x.type}-v${x.version}.txt`,x.content)},
 'load-doc':t=>{const x=S.docs.find(d=>d.id===t.dataset.id);if(S.pkg&&S.pkg.jobId===x.jobId&&S.pkg.texts[x.type]!==undefined){S.pkg.texts[x.type]=x.content;save();render();toast('Loaded '+docTitle(x))}},
 'gen-pkg':()=>{
  const j=curJob(),a=ensureAnalysis(j);const rec=$('#pk-rec').value;
  const m=genMessages(j,a,S.profile,{recipient:rec});
  S.pkg={jobId:j.id,recipient:rec,texts:{cover:m.cover,email:m.email,linkedin:m.linkedin,motivation:m.motivation},confirms:m.confirms,interview:genInterview(j,a,S.profile)};
  if(!S.profile.name)S.pkg.confirms.unshift('Your name is missing in your profile');
  save();render();
 },
 'copy-pk':t=>copyText(S.pkg.texts[t.dataset.key]),
 'dl-pk':t=>{const j=curJob();saveFile(`${slug(j.company)}-${slug(j.title)}-${t.dataset.key}-draft.txt`,S.pkg.texts[t.dataset.key])},
 'dl-pk-docx':t=>{const j=curJob();saveDocx(`${slug(j.company)}-${slug(j.title)}-${t.dataset.key}-draft.docx`,S.pkg.texts[t.dataset.key])},
 'save-pk':t=>{const j=curJob();const d=saveDoc(j.id,PKTYPE[t.dataset.key],S.pkg.texts[t.dataset.key]);render();toast('Saved: '+docTitle(d))},
 'ai-translate':async t=>{
  const k=t.dataset.key,lang=ui.pkLang,el=$('#pk-tr-'+k);el.innerHTML='<p class="muted">Thinking...</p>';
  try{const r=await ask(`Rewrite this application text in ${lang}, adapted to professional conventions in ${lang==='Norwegian'?'Norway':'the Netherlands'}. Keep every fact, name, number and bracketed placeholder unchanged. Do not add claims. Do not state or imply that the writer is fluent in ${lang}. Output only the text.\n\n${S.pkg.texts[k]}`);ui.aiText['tr:'+k]=r;el.innerHTML=aiBox(r)+`<p class="small muted">Have a fluent speaker review this before use.</p>`}
  catch(e){el.innerHTML=`<div class="note bad">${esc(e.message)}</div>`}
 },
 'open-job':t=>openJob(t.dataset.id),
 'save-trk':t=>{
  const j=jobById(t.dataset.id);
  ['title','company','url','appliedDate','followUp','interviewDate','cvVersion','coverVersion','recruiter','notes'].forEach(k=>{j[k]=$('#m-'+k).value.trim()});
  setStatus(j,$('#m-status').value);j.updated=new Date().toISOString();save();closeModal();render();toast('Saved');
 },
 'goto-tailor':t=>{ui.jobId=t.dataset.id;closeModal();setView('tailor')},
 'goto-msgs':t=>{ui.jobId=t.dataset.id;closeModal();setView('messages')},
 'export-json':()=>{S.meta.lastExport=new Date().toISOString();save();paintStore();saveFile(`jobpilot-export-${todayISO()}.json`,JSON.stringify(S,null,1))},
 'export-csv':()=>saveFile(`jobpilot-tracker-${todayISO()}.csv`,toCSV(S.jobs)),
 'import-open':()=>modal(`<div class="card-h"><h2>Import data</h2><button class="btn sm" data-act="close-modal" type="button">Close</button></div>
  <p class="muted small">Accepts a full JSON export from this app, a JSON array of jobs, or a CSV with at least "company" and "title" columns. Duplicates are skipped.</p>
  <label class="f"><span>Choose a file</span><input type="file" id="imp-file" accept=".json,.csv,text/csv,application/json"></label>
  <label class="f"><span>Or paste the content</span><textarea class="doc" id="imp-text" rows="8"></textarea></label>
  <label class="chk"><input type="checkbox" id="imp-replace"><span>Replace my current data instead of merging (a full JSON export also replaces your profile)</span></label>
  <div id="imp-res"></div><div class="row"><button class="btn primary" data-act="import-do" type="button">Import</button></div>`),
 'import-do':()=>{
  const r=doImport($('#imp-text').value,$('#imp-replace').checked);
  if(r.err)return showMsg('imp-res','bad',esc(r.err));
  showMsg('imp-res','good',esc(r.ok));render();
 },
 'reset-all':t=>{if(t.dataset.yes){try{localStorage.removeItem(LS_KEY)}catch{}ui={jobId:null,editingId:null,filter:{status:'',q:'',due:false,sort:'score'},draft:null,msg:null,aiText:{},profTab:'profile'};initState();ui.confirm=null;render();toast('All data reset')}else{ui.confirm='reset-allx';render()}},
 'load-resume-seed':()=>{S.profile=seedProfile();delete S.meta.oldSeed;S.draft=null;S.pkg=null;S.jobs.forEach(j=>{j.analysis=null});S.jobs.forEach(j=>ensureAnalysis(j));save();render();toast('Profile replaced with your resume data')},
 'prof-tab':t=>{ui.profTab=t.dataset.tab;render()},
 'add-role':()=>{S.profile.experience.unshift({id:uid(),title:'',company:'',dates:'',bullets:[{id:uid(),text:'',metric:'',metricVerified:false}]});save();render()},
 'del-role':t=>{if(t.dataset.yes){S.profile.experience=S.profile.experience.filter(e=>e.id!==t.dataset.id);ui.confirm=null;save();render()}else{ui.confirm='del-role'+t.dataset.id;render()}},
 'add-bullet':t=>{S.profile.experience.find(e=>e.id===t.dataset.id).bullets.push({id:uid(),text:'',metric:'',metricVerified:false});save();render()},
 'del-bullet':t=>{const e=S.profile.experience.find(e=>e.id===t.dataset.id);e.bullets=e.bullets.filter(b=>b.id!==t.dataset.b);save();render()},
 'add-edu':()=>{S.profile.education.push({id:uid(),degree:'',school:'',dates:'',status:'completed'});save();render()},
 'del-edu':t=>{S.profile.education=S.profile.education.filter(e=>e.id!==t.dataset.id);save();render()},
 'add-proj':()=>{S.profile.projects.push({id:uid(),name:'',desc:''});save();render()},
 'del-proj':t=>{S.profile.projects=S.profile.projects.filter(e=>e.id!==t.dataset.id);save();render()},
 'add-lang':()=>{S.profile.languages.push({id:uid(),lang:'',level:'',confirmed:false});save();render()},
 'del-lang':t=>{S.profile.languages=S.profile.languages.filter(e=>e.id!==t.dataset.id);save();render()},
 'copy-master':()=>copyText(assembleCV(buildCV(S.profile,null,null,{pages:2,includeUnverified:false,includePhone:S.settings.includePhone,includeLinks:S.settings.includeLinks}).sections)),
 'extract-ai':async()=>{
  const p=S.profile;const el=$('#cv-extract');
  if(p.masterCvText.trim().length<100){el.innerHTML='<div class="note warn">Paste your CV text first.</div>';return}
  el.innerHTML='<p class="muted">Thinking...</p>';
  try{
   const r=await ask(`Compare this CV text with the structured profile. List only items that appear in the CV text but are missing from the profile, and notable differences (dates, titles, numbers). Do not invent anything. Return only JSON: {"skills":[],"certs":[],"languages":[],"notes":[]}.\n\nProfile:\n${profileForAI()}\n\nCV text:\n${p.masterCvText.slice(0,12000)}`,true);
   const have=new Set([...p.skills,...p.certs,...p.languages.map(l=>l.lang)].map(s=>s.toLowerCase()));
   const clean=a=>(Array.isArray(a)?a:[]).map(String).filter(s=>s.trim()&&!have.has(s.toLowerCase())).slice(0,30);
   ui.extract={skills:clean(r.skills),certs:clean(r.certs),languages:clean(r.languages),notes:(Array.isArray(r.notes)?r.notes:[]).map(String).slice(0,12)};
  }catch(e){ui.extract={err:e.message}}
  el.innerHTML=renderExtract();
 },
 'apply-extract':()=>{
  const x=ui.extract;let n=0;
  $$('[data-ex]').forEach(c=>{if(!c.checked)return;const v=x[c.dataset.ex][+c.dataset.i];
   if(c.dataset.ex==='skills')S.profile.skills.push(v);else if(c.dataset.ex==='certs')S.profile.certs.push(v);else S.profile.languages.push({id:uid(),lang:v,level:'',confirmed:false});n++});
  ui.extract=null;save();render();toast(`Added ${n} item${n===1?'':'s'}`);
 }
};
document.addEventListener('click',e=>{
 if(e.target.closest('[data-stop]'))return;
 const t=e.target.closest('[data-view],[data-open-analyze],[data-act]');if(!t)return;
 if(t.dataset.openAnalyze){e.preventDefault();ui.jobId=t.dataset.openAnalyze;closeModal();setView('analyze');return}
 if(t.dataset.view){e.preventDefault();closeModal();setView(t.dataset.view);return}
 const fn=ACT[t.dataset.act];if(fn){const r=fn(t,e);if(r&&r.catch)r.catch(err=>toast(err.message||'Something went wrong'))}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.bind)return applyBind(t);
 const c=t.dataset.change;
 if(c==='sel-job'){ui.jobId=t.value;render()}
 else if(c==='trk-status'){setStatus(jobById(t.dataset.id),t.value);render()}
 else if(c==='filter'){ui.filter.status=$('#f-status').value;ui.filter.sort=$('#f-sort').value;ui.filter.due=$('#f-due').checked;$('#trk-body').innerHTML=trackerTable()}
 else if(t.id==='approve'){D().approved=t.checked;save()}
 else if(t.id==='t-lang'){ui.tLang=t.value}
 else if(t.id==='pk-lang'){ui.pkLang=t.value;render()}
 else if(t.dataset.input==='sec'){const j=curJob();$('#checks').innerHTML=checksHtml(j,j.analysis)}
 else if(t.id==='cv-file'||t.id==='imp-file'){
  const f=t.files[0];if(!f)return;
  if(f.size>2e6)return toast('That file is larger than 2 MB.');
  const r=new FileReader();r.onerror=()=>toast('Could not read that file.');
  r.onload=()=>{
   if(t.id==='imp-file'){$('#imp-text').value=String(r.result)}
   else{S.profile.masterCvText=String(r.result);S.profile.masterCvUpdated=new Date().toISOString();save();render();toast('Master CV text loaded')}
  };r.readAsText(f);
 }
});
document.addEventListener('input',e=>{
 const t=e.target,k=t.dataset.input;if(!k)return;
 if(k==='filter'){ui.filter.q=t.value;$('#trk-body').innerHTML=trackerTable()}
 else if(k==='sec'){const d=D();d.sections[t.dataset.sec]=t.value;d.approved=false;const a=$('#approve');if(a)a.checked=false;save()}
 else if(k==='pk'){
  const key=t.dataset.key;S.pkg.texts[key]=t.value;save();
  $('#pk-warn-'+key).innerHTML=pkWarn(key,t.value);
  $('#pk-count-'+key).textContent=key==='linkedin'?`${t.value.length} characters. Connection notes are limited to a few hundred characters; shorten it if LinkedIn rejects it.`:`${t.value.split(/\s+/).filter(Boolean).length} words`;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#theme-btn').addEventListener('click',()=>{
 const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
 r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('jobpilot.theme',r.dataset.theme)}catch{}
});
(function boot(){
 try{const th=localStorage.getItem('jobpilot.theme');if(th)document.documentElement.dataset.theme=th}catch{}
 initState();
 const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))view=h;
 const recent=[...S.jobs].sort((a,b)=>(b.updated||'').localeCompare(a.updated||''))[0];if(recent)ui.jobId=recent.id;
 render();
 initCaps().then(()=>{if(sampleFn&&view==='messages')render()});
})();
</script>
